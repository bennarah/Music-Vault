name: MusicVault CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test


  frontend:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

    #  - name: Run frontend tests
    #    working-directory: frontend
    #   run: npm test

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.run_number }}
          path: frontend/dist/
          retention-days: 30


  build-info:
    name: Generate Build Information
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Create build information
        run: |
          echo "MusicVault Build ${{ github.run_number }}" > build-version.txt
          echo "Commit: ${{ github.sha }}" >> build-version.txt
          echo "Branch: ${{ github.ref_name }}" >> build-version.txt

      - name: Display build information
        run: cat build-version.txt

      - name: Upload build information
        uses: actions/upload-artifact@v7
        with:
          name: musicvault-build-${{ github.run_number }}
          path: build-version.txt
          retention-days: 30